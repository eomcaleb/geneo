<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="An org-chart view of the genealogy in Genesis 1–5, built up chapter by chapter.">
<title>Genesis 1–5 Genealogy</title>
<style>
  :root {
    --bg: #000;
    --panel: #0c0c0c;
    --line: #1c1c1c;
    --wire: #3a3a3a;
    --box: #2a2a2a;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --faint: #555;
    --hi: #d9b45a;
    --male: #7aa2c4;
    --female: #d58aa6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans);
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* Chapter list */
  aside {
    flex: 0 0 auto; display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  aside button {
    background: none; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--line);
    color: var(--faint); text-align: left; cursor: pointer; padding: 14px 18px 14px 14px;
    font: 12px var(--mono); letter-spacing: .04em;
  }
  aside button b { display: block; font: 600 18px/1.1 var(--mono); }
  aside button span { display: block; font-size: 10px; margin-top: 3px; }
  aside button:hover { color: var(--text); }
  aside button[aria-selected="true"] { color: var(--text); border-left-color: var(--hi); background: #080808; }
  aside button[aria-selected="true"] span { color: var(--dim); }
  @media (max-width: 600px) {
    aside button { padding: 12px 12px 12px 10px; font-size: 10px; }
    aside button span { display: none; }
  }

  /* Org chart */
  main { flex: 1; min-width: 0; overflow: auto; padding: 24px 16px 48px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .tree { width: max-content; margin: 0 auto; }
  .tree ul { display: flex; justify-content: center; margin: 0; padding: 18px 0 0; position: relative; }
  .tree > ul { padding-top: 0; }
  .tree li { list-style: none; position: relative; padding: 18px 3px 0; display: flex; flex-direction: column; align-items: center; }
  .tree > ul > li { padding-top: 0; }
  .tree li::before, .tree li::after {
    content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 18px;
    border-top: 1px solid var(--wire);
  }
  .tree li::after { right: auto; left: 50%; border-left: 1px solid var(--wire); }
  .tree li:only-child::before, .tree li:only-child::after, .tree > ul > li::before, .tree > ul > li::after { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0; }
  .tree li:last-child::before { border-right: 1px solid var(--wire); border-radius: 0 5px 0 0; }
  .tree li:first-child::after { border-radius: 5px 0 0 0; }
  .tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 1px solid var(--wire); }
  .tree li.folded > ul { display: none; }

  .unit { position: relative; display: flex; align-items: center; }
  .pair .bond { width: 14px; height: 1px; background: var(--wire); }

  .node {
    position: relative; min-width: 72px; max-width: 128px; padding: 6px 9px 7px;
    background: var(--panel); border: 1px solid var(--box); border-radius: 6px;
    text-align: center; animation: in .25s ease-out both;
  }
  .node b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .node span { display: block; font: 10px/1.3 var(--mono); color: var(--dim); margin-top: 2px; white-space: nowrap; }
  .node i { font-style: normal; font-size: 11px; margin-right: 4px; font-weight: 400; }
  .node.m { border-radius: 2px; border-color: #2b3a47; }
  .node.m i { color: var(--male); }
  .node.f { border-radius: 14px; border-color: #4a2f3a; }
  .node.f i { color: var(--female); }
  .node.root { border-color: #444; }
  .node.ghost { border-style: dashed; border-color: var(--hi); background: transparent; }
  .node.ghost b { color: var(--hi); font-weight: 500; }
  .node.end b { color: var(--dim); }
  .node.new { border-color: var(--hi); box-shadow: 0 0 0 1px rgba(217, 180, 90, .25), 0 0 14px rgba(217, 180, 90, .12); }
  .node.upd span { color: var(--hi); }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }

  .fold {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 2;
    min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--wire); color: var(--dim);
    font: 10px/14px var(--mono); cursor: pointer;
  }
  .fold:hover { color: var(--text); border-color: var(--dim); }
</style>
</head>
<body>
  <aside role="tablist" aria-label="Chapter" id="tabs"></aside>
  <main id="chart"><div class="tree" id="tree"></div></main>

<script>
  // Values keyed by chapter take the latest key ≤ the current chapter.
  // ch = chapter the node first appears in; only = shown in that chapter only.
  // sex: m / f; pair = two people joined as a couple, children hang from the middle.
  const TREE = {
    id: "god", name: "God", sub: "1:1", ch: 1, cls: "root",
    kids: [{
      id: "adam", ch: 1,
      pair: [
        { sex: "m", name: { 1: "Male", 2: "The man", 3: "Adam" }, sub: { 1: "1:27", 2: "dust · 2:7", 5: "930 yrs" } },
        { sex: "f", name: { 1: "Female", 2: "The woman", 3: "Eve" }, sub: { 1: "1:27", 2: "rib · 2:22", 3: "named · 3:20" } }
      ],
      kids: [
        { id: "seed", ch: 3, only: 3, cls: "ghost", name: "Seed of the woman", sub: "3:15" },
        { id: "cain", ch: 4, sex: "m", name: "Cain", sub: "4:1",
          kids: [{ id: "enochC", ch: 4, sex: "m", name: "Enoch", sub: "city · 4:17",
            kids: [{ id: "irad", ch: 4, sex: "m", name: "Irad", sub: "4:18",
              kids: [{ id: "mehujael", ch: 4, sex: "m", name: "Mehujael", sub: "4:18",
                kids: [{ id: "methushael", ch: 4, sex: "m", name: "Methushael", sub: "4:18",
                  kids: [{ id: "lamechC", ch: 4, sex: "m", name: "Lamech", sub: "4:18",
                    kids: [
                      { id: "adah", ch: 4, sex: "f", name: "Adah", sub: "wife · 4:19",
                        kids: [
                          { id: "jabal", ch: 4, sex: "m", name: "Jabal", sub: "herds · 4:20" },
                          { id: "jubal", ch: 4, sex: "m", name: "Jubal", sub: "music · 4:21" }
                        ] },
                      { id: "zillah", ch: 4, sex: "f", name: "Zillah", sub: "wife · 4:19",
                        kids: [
                          { id: "tubal", ch: 4, sex: "m", name: "Tubal-cain", sub: "metal · 4:22" },
                          { id: "naamah", ch: 4, sex: "f", name: "Naamah", sub: "4:22" }
                        ] }
                    ] }] }] }] }] }] },
        { id: "abel", ch: 4, sex: "m", cls: "end", name: "Abel", sub: "killed · 4:8" },
        { id: "seth", ch: 4, sex: "m", name: "Seth", sub: { 4: "4:25", 5: "912 yrs" },
          kids: [{ id: "enosh", ch: 4, sex: "m", name: "Enosh", sub: { 4: "4:26", 5: "905 yrs" },
            kids: [{ id: "kenan", ch: 5, sex: "m", name: "Kenan", sub: "910 yrs",
              kids: [{ id: "mahalalel", ch: 5, sex: "m", name: "Mahalalel", sub: "895 yrs",
                kids: [{ id: "jared", ch: 5, sex: "m", name: "Jared", sub: "962 yrs",
                  kids: [{ id: "enochS", ch: 5, sex: "m", name: "Enoch", sub: "taken ↑ 365",
                    kids: [{ id: "methuselah", ch: 5, sex: "m", name: "Methuselah", sub: "969 yrs",
                      kids: [{ id: "lamechS", ch: 5, sex: "m", name: "Lamech", sub: "777 yrs",
                        kids: [{ id: "noah", ch: 5, sex: "m", name: "Noah", sub: "5:29",
                          kids: [
                            { id: "shem", ch: 5, sex: "m", name: "Shem", sub: "5:32" },
                            { id: "ham", ch: 5, sex: "m", name: "Ham", sub: "5:32" },
                            { id: "japheth", ch: 5, sex: "m", name: "Japheth", sub: "5:32" }
                          ] }] }] }] }] }] }] }] }] }
      ]
    }]
  };

  const CH = { 1: "Creation", 2: "Eden", 3: "Fall", 4: "Two lines", 5: "To Noah" };
  const SYM = { m: "♂︎", f: "♀︎" };

  const at = (v, ch) => {
    if (v == null || typeof v !== "object") return v;
    let r; for (const k in v) if (+k <= ch) r = v[k];
    return r;
  };
  const keyed = (v, ch) => v != null && typeof v === "object" && ch in v;
  const visible = (n, ch) => n.ch <= ch && (!n.only || n.only === ch);

  let cur = 5;
  const folded = new Set();

  function count(n, ch) {
    return (n.kids || []).filter(k => visible(k, ch)).reduce((s, k) => s + 1 + count(k, ch), 0);
  }

  function box(p, ch, isNodeNew) {
    const isNew = isNodeNew || keyed(p.name, ch);
    const upd = !isNew && keyed(p.sub, ch);
    const cls = ["node", p.sex, p.cls, isNew && "new", upd && "upd"].filter(Boolean).join(" ");
    const sym = p.sex ? `<i aria-label="${p.sex === "m" ? "male" : "female"}">${SYM[p.sex]}</i>` : "";
    return `<div class="${cls}"><b>${sym}${at(p.name, ch)}</b><span>${at(p.sub, ch)}</span></div>`;
  }

  function render(n, ch) {
    if (!visible(n, ch)) return "";
    const kids = (n.kids || []).map(k => render(k, ch)).join("");
    const isNew = n.ch === ch;
    const body = n.pair
      ? box(n.pair[0], ch, isNew) + `<span class="bond"></span>` + box(n.pair[1], ch, isNew)
      : box(n, ch, isNew);
    const f = folded.has(n.id);
    const btn = kids ? `<button class="fold" type="button" data-fold="${n.id}" aria-label="${f ? "Expand" : "Collapse"}">${f ? "+" + count(n, ch) : "−"}</button>` : "";
    return `<li class="${f ? "folded" : ""}"><div class="unit${n.pair ? " pair" : ""}">${body}${btn}</div>${kids ? `<ul>${kids}</ul>` : ""}</li>`;
  }

  const chart = document.getElementById("chart"), tree = document.getElementById("tree"), tabs = document.getElementById("tabs");

  function draw(center) {
    tree.innerHTML = `<ul>${render(TREE, cur)}</ul>`;
    if (!center) return;
    chart.scrollTop = 0;
    const first = tree.querySelector(".node.new");
    if (!first) return;
    const c = chart.getBoundingClientRect(), r = first.getBoundingClientRect();
    chart.scrollLeft += (r.left + r.width / 2) - (c.left + c.width / 2);
    if (r.bottom > c.bottom) chart.scrollTop += r.top - c.top - c.height * 0.3;
  }

  function setChapter(ch) {
    cur = ch;
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", +b.dataset.ch === ch));
    draw(true);
    history.replaceState(null, "", "#gen" + ch);
  }

  tabs.innerHTML = Object.entries(CH).map(([ch, label]) =>
    `<button type="button" role="tab" data-ch="${ch}">Gen<b>${ch}</b><span>${label}</span></button>`).join("");
  tabs.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setChapter(+b.dataset.ch);
  });

  tree.addEventListener("click", e => {
    const f = e.target.closest("[data-fold]");
    if (!f) return;
    const id = f.dataset.fold;
    folded.has(id) ? folded.delete(id) : folded.add(id);
    draw(false);
  });

  const m = location.hash.match(/^#gen([1-5])$/);
  setChapter(m ? +m[1] : 5);
</script>
</body>
</html>
