<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="An org-chart view of the genealogy in Genesis 1–5, built up chapter by chapter.">
<title>Genesis 1–5 Genealogy</title>
<style>
  :root {
    --bg: #000;
    --panel: #0c0c0c;
    --line: #1c1c1c;
    --wire: #3a3a3a;
    --box: #2a2a2a;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --faint: #555;
    --hi: #d9b45a;
    --male: #7aa2c4;
    --female: #d58aa6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans);
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* Chapter list */
  aside {
    flex: 0 0 auto; display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  aside button {
    background: none; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--line);
    color: var(--faint); text-align: left; cursor: pointer; padding: 14px 18px 14px 14px;
    font: 12px var(--mono); letter-spacing: .04em;
  }
  aside button b { display: block; font: 600 18px/1.1 var(--mono); white-space: nowrap; }
  aside button span { display: block; font-size: 10px; margin-top: 3px; }
  aside button:hover { color: var(--text); }
  aside button[aria-selected="true"] { color: var(--text); border-left-color: var(--hi); background: #080808; }
  aside button[aria-selected="true"] span { color: var(--dim); }
  @media (max-width: 600px) {
    aside button { padding: 12px 10px 12px 8px; font-size: 10px; }
    aside button b { font-size: 15px; }
    aside button span { display: none; }
  }

  /* Org chart: every box has a fixed slot; chapters only fade boxes in and out */
  main { position: relative; flex: 1; min-width: 0; overflow: auto; padding: 8px 0 40px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .stage { position: relative; margin: 0 auto; }
  .anim .stage { transition: width .4s var(--ease), height .4s var(--ease); }

  .wire { position: absolute; left: 0; top: 0; background: var(--wire); }
  .anim .wire { transition: left .4s var(--ease), top .4s var(--ease), width .4s var(--ease), height .4s var(--ease), opacity .3s; }

  .unit { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
  .anim .unit { transition: transform .4s var(--ease), opacity .3s; }
  .off { opacity: 0; pointer-events: none; }
  .bond { flex: 0 0 12px; height: 1px; background: var(--wire); }

  .node {
    position: relative; width: 92px; height: 44px; padding: 0 5px;
    display: flex; flex-direction: column; justify-content: center;
    background: var(--panel); border: 1px solid var(--box); border-radius: 6px; text-align: center;
    transition: border-color .3s, box-shadow .3s;
  }
  .node b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .sub { display: block; font: 10px/1.3 var(--mono); color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
  .node i { font-style: normal; font-size: 11px; margin-right: 4px; font-weight: 400; }
  .node.m { border-radius: 2px; border-color: #2b3a47; }
  .node.m i { color: var(--male); }
  .node.f { border-radius: 14px; border-color: #4a2f3a; }
  .node.f i { color: var(--female); }
  .node.root { border-color: #444; }
  .node.ghost { width: 132px; border-style: dashed; border-color: var(--hi); background: transparent; }
  .node.ghost b { color: var(--hi); font-weight: 500; }
  .node.new { border-color: var(--hi); box-shadow: 0 0 0 1px rgba(217, 180, 90, .25), 0 0 14px rgba(217, 180, 90, .12); }
  .node.upd .sub { color: var(--hi); }

  .fold {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 2;
    min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--wire); color: var(--dim);
    font: 10px/14px var(--mono); cursor: pointer; transition: opacity .3s;
  }
  .fold:hover { color: var(--text); border-color: var(--dim); }
</style>
</head>
<body>
  <aside role="tablist" aria-label="Chapter" id="tabs"></aside>
  <main id="chart"><div class="stage" id="stage"></div></main>

<script>
  // Values keyed by chapter take the latest key ≤ the view's last chapter.
  // ch = chapter the node first appears in; only = shown only in the view covering that chapter;
  // slot = sits in another node's position instead of taking its own.
  // sex: m / f; pair = two people joined as a couple, children hang from the middle.
  const TREE = {
    id: "god", name: "God", sub: "1:1", ch: 1, cls: "root",
    kids: [{
      id: "adam", ch: 1,
      pair: [
        { sex: "m", name: { 1: "Male", 2: "The man", 3: "Adam" }, sub: { 1: "1:27", 2: "2:7", 5: "930 yrs" } },
        { sex: "f", name: { 1: "Female", 2: "The woman", 3: "Eve" }, sub: { 1: "1:27", 2: "2:22", 3: "3:20" } }
      ],
      kids: [
        { id: "cain", ch: 4, sex: "m", name: "Cain", sub: "4:1",
          kids: [{ id: "enochC", ch: 4, sex: "m", name: "Enoch", sub: "4:17",
            kids: [{ id: "irad", ch: 4, sex: "m", name: "Irad", sub: "4:18",
              kids: [{ id: "mehujael", ch: 4, sex: "m", name: "Mehujael", sub: "4:18",
                kids: [{ id: "methushael", ch: 4, sex: "m", name: "Methushael", sub: "4:18",
                  kids: [{ id: "lamechC", ch: 4, sex: "m", name: "Lamech", sub: "4:18",
                    kids: [
                      { id: "adah", ch: 4, sex: "f", name: "Adah", sub: "4:19",
                        kids: [
                          { id: "jabal", ch: 4, sex: "m", name: "Jabal", sub: "4:20" },
                          { id: "jubal", ch: 4, sex: "m", name: "Jubal", sub: "4:21" }
                        ] },
                      { id: "zillah", ch: 4, sex: "f", name: "Zillah", sub: "4:19",
                        kids: [
                          { id: "tubal", ch: 4, sex: "m", name: "Tubal-cain", sub: "4:22" },
                          { id: "naamah", ch: 4, sex: "f", name: "Naamah", sub: "4:22" }
                        ] }
                    ] }] }] }] }] }] },
        { id: "abel", ch: 4, sex: "m", name: "Abel", sub: "4:8" },
        { id: "seed", ch: 3, only: 3, slot: "abel", cls: "ghost", name: "Seed of the woman", sub: "3:15" },
        { id: "seth", ch: 4, sex: "m", name: "Seth", sub: { 4: "4:25", 5: "912 yrs" },
          kids: [{ id: "enosh", ch: 4, sex: "m", name: "Enosh", sub: { 4: "4:26", 5: "905 yrs" },
            kids: [{ id: "kenan", ch: 5, sex: "m", name: "Kenan", sub: "910 yrs",
              kids: [{ id: "mahalalel", ch: 5, sex: "m", name: "Mahalalel", sub: "895 yrs",
                kids: [{ id: "jared", ch: 5, sex: "m", name: "Jared", sub: "962 yrs",
                  kids: [{ id: "enochS", ch: 5, sex: "m", name: "Enoch", sub: "365 yrs",
                    kids: [{ id: "methuselah", ch: 5, sex: "m", name: "Methuselah", sub: "969 yrs",
                      kids: [{ id: "lamechS", ch: 5, sex: "m", name: "Lamech", sub: "777 yrs",
                        kids: [{ id: "noah", ch: 5, sex: "m", name: "Noah", sub: "5:29",
                          kids: [
                            { id: "shem", ch: 5, sex: "m", name: "Shem", sub: "5:32" },
                            { id: "ham", ch: 5, sex: "m", name: "Ham", sub: "5:32" },
                            { id: "japheth", ch: 5, sex: "m", name: "Japheth", sub: "5:32" }
                          ] }] }] }] }] }] }] }] }] }
      ]
    }]
  };

  // Genesis 1–3 add no new descendants, so they share one view.
  const VIEWS = [
    { from: 1, to: 3, label: "1–3", sub: "Creation · Fall" },
    { from: 4, to: 4, label: "4", sub: "Two lines" },
    { from: 5, to: 5, label: "5", sub: "To Noah" }
  ];
  const W = 92, H = 44, BOND = 12, GAP = 8, ROW = 72, PAD = 20;
  const SYM = { m: "♂︎", f: "♀︎" };

  const at = (v, ch) => {
    if (v == null || typeof v !== "object") return v;
    let r; for (const k in v) if (+k <= ch) r = v[k];
    return r;
  };
  const changedIn = (v, view) => v != null && typeof v === "object" && Object.keys(v).some(k => k >= view.from && k <= view.to);

  const nodes = [], byId = {};
  (function walk(n, parent, depth) {
    Object.assign(n, { parent, depth, kids: n.kids || [] });
    nodes.push(n); byId[n.id] = n;
    n.kids.forEach(k => walk(k, n, depth + 1));
  })(TREE, null, 0);

  let view = VIEWS[2];
  const folded = new Set();
  const inView = n => n.ch <= view.to && (!n.only || (n.only >= view.from && n.only <= view.to));
  const foldedAbove = n => { for (let p = n.parent; p; p = p.parent) if (folded.has(p.id)) return p; return null; };
  const shown = n => inView(n) && !foldedAbove(n);

  // Layout uses the full tree (not the current chapter), so switching chapters never moves anything.
  const layoutKids = n => folded.has(n.id) ? [] : n.kids.filter(k => !k.slot);
  const unitW = n => n.pair ? 2 * W + BOND : W;
  function measure(n) {
    const ks = layoutKids(n);
    ks.forEach(measure);
    n.kw = ks.reduce((s, k) => s + k.sw, 0) + GAP * Math.max(0, ks.length - 1);
    n.sw = Math.max(unitW(n), n.kw);
  }
  function place(n, left) {
    n.cx = left + n.sw / 2;
    n.y = PAD + n.depth * ROW;
    let x = left + (n.sw - n.kw) / 2;
    layoutKids(n).forEach(k => { place(k, x); x += k.sw + GAP; });
  }

  // Build every element once.
  const stage = document.getElementById("stage"), chart = document.getElementById("chart");
  const wire = () => { const d = document.createElement("div"); d.className = "wire off"; stage.appendChild(d); return d; };
  const boxHTML = p => `<div class="node ${p.sex || ""} ${p.cls || ""}"><b>${p.sex ? `<i>${SYM[p.sex]}</i>` : ""}<span class="nm"></span></b><span class="sub"></span></div>`;
  nodes.forEach(n => {
    if (n.kids.length) { n.stem = wire(); n.bar = wire(); }
    if (n.parent) n.drop = wire();
  });
  nodes.forEach(n => {
    n.el = document.createElement("div");
    n.el.className = "unit off";
    n.el.innerHTML = (n.pair ? boxHTML(n.pair[0]) + `<span class="bond"></span>` + boxHTML(n.pair[1]) : boxHTML(n))
      + (n.kids.length ? `<button class="fold" type="button" data-fold="${n.id}"></button>` : "");
    n.boxes = [...n.el.querySelectorAll(".node")];
    n.btn = n.el.querySelector(".fold");
    stage.appendChild(n.el);
  });

  function setWire(el, x, y, w, h, on) {
    Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
    el.classList.toggle("off", !on);
  }

  function update() {
    measure(TREE);
    place(TREE, PAD);
    // Folded-away nodes collapse into the folded ancestor; slotted nodes borrow their slot.
    nodes.forEach(n => {
      const f = foldedAbove(n);
      if (n.slot) { const s = byId[n.slot]; n.cx = s.cx; n.y = s.y; }
      else if (f) { n.cx = f.cx; n.y = f.y; }
    });

    let bottom = 0;
    nodes.forEach(n => {
      const on = shown(n);
      if (on) bottom = Math.max(bottom, n.y + H);
      n.el.style.width = unitW(n) + "px";
      n.el.style.transform = `translate(${n.cx - unitW(n) / 2}px, ${n.y}px)`;
      n.el.classList.toggle("off", !on);

      const isNew = n.ch >= view.from && n.ch <= view.to;
      (n.pair || [n]).forEach((p, i) => {
        const bx = n.boxes[i];
        bx.querySelector(".nm").textContent = at(p.name, view.to);
        bx.querySelector(".sub").textContent = at(p.sub, view.to);
        bx.classList.toggle("new", isNew);
        bx.classList.toggle("upd", !isNew && changedIn(p.sub, view));
      });

      if (!n.kids.length) return;
      const vis = n.kids.filter(shown);
      const top = n.y + (n.pair ? H / 2 : H), mid = n.y + H + (ROW - H) / 2;
      setWire(n.stem, n.cx, top, 1, mid - top, vis.length > 0);
      const xs = vis.length > 1 ? vis.map(k => k.cx) : [n.cx];
      setWire(n.bar, Math.min(...xs), mid, Math.max(...xs) - Math.min(...xs) + 1, 1, vis.length > 1);
      n.kids.forEach(k => setWire(k.drop, k.cx, mid, 1, k.y - mid, shown(k)));

      const hidden = n.kids.filter(inView);
      const isFolded = folded.has(n.id);
      const count = k => inView(k) ? 1 + k.kids.reduce((s, c) => s + count(c), 0) : 0;
      n.btn.classList.toggle("off", !hidden.length);
      n.btn.textContent = isFolded ? "+" + hidden.reduce((s, k) => s + count(k), 0) : "−";
      n.btn.setAttribute("aria-label", isFolded ? "Expand branch" : "Collapse branch");
    });

    stage.style.width = TREE.sw + 2 * PAD + "px";
    stage.style.height = Math.max(bottom, TREE.y + ROW * 2) + PAD + "px";
  }

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = VIEWS.map((v, i) =>
    `<button type="button" role="tab" data-i="${i}">Gen<b>${v.label}</b><span>${v.sub}</span></button>`).join("");

  function setView(i) {
    view = VIEWS[i];
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", +b.dataset.i === i));
    update();
    history.replaceState(null, "", "#gen" + view.to);
  }

  tabs.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setView(+b.dataset.i);
  });
  stage.addEventListener("click", e => {
    const f = e.target.closest("[data-fold]");
    if (!f) return;
    const id = f.dataset.fold;
    folded.has(id) ? folded.delete(id) : folded.add(id);
    update();
  });

  const m = location.hash.match(/^#gen([1-5])$/);
  setView(m ? VIEWS.findIndex(v => +m[1] <= v.to) : 2);
  chart.scrollLeft = stage.offsetLeft + TREE.cx - chart.clientWidth / 2;
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("anim")));
</script>
</body>
</html>
