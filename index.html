<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="An org-chart view of the genealogy in Genesis 1–10, built up chapter by chapter.">
<title>Genesis 1–10 Genealogy</title>
<style>
  :root {
    --bg: #000;
    --panel: #0c0c0c;
    --line: #1c1c1c;
    --wire: #3a3a3a;
    --box: #2a2a2a;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --faint: #555;
    --hi: #d9b45a;
    --male: #7aa2c4;
    --female: #d58aa6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans);
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* Chapter list */
  aside {
    flex: 0 0 auto; display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  aside button {
    background: none; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--line);
    color: var(--faint); text-align: left; cursor: pointer; padding: 14px 18px 14px 14px;
    font: 12px var(--mono); letter-spacing: .04em;
  }
  aside button b { display: block; font: 600 18px/1.1 var(--mono); white-space: nowrap; }
  aside button:hover { color: var(--text); }
  aside button[aria-selected="true"] { color: var(--text); border-left-color: var(--hi); background: #080808; }
  @media (max-width: 600px) {
    aside button { padding: 12px 10px 12px 8px; font-size: 10px; }
    aside button b { font-size: 15px; }
  }

  /* Org chart: every box has a fixed slot; chapters only fade boxes in and out */
  main { position: relative; flex: 1; min-width: 0; overflow: auto; padding: 8px 0 40px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .stage { position: relative; margin: 0 auto; }
  .anim .stage { transition: width .4s var(--ease), height .4s var(--ease); }

  .wire { position: absolute; left: 0; top: 0; background: var(--wire); }
  .anim .wire { transition: left .4s var(--ease), top .4s var(--ease), width .4s var(--ease), height .4s var(--ease), opacity .3s; }

  .unit { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
  .anim .unit { transition: transform .4s var(--ease), opacity .3s; }
  .off { opacity: 0; pointer-events: none; }
  .bond { flex: 0 0 10px; height: 1px; background: var(--wire); }

  .node {
    position: relative; width: 96px; height: 30px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--box); border-radius: 6px;
    font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color .3s, box-shadow .3s;
  }
  .node i { font-style: normal; font-size: 11px; margin-right: 4px; font-weight: 400; }
  .node.m { border-radius: 2px; border-color: #2b3a47; }
  .node.m i { color: var(--male); }
  .node.f { border-radius: 14px; border-color: #4a2f3a; }
  .node.f i { color: var(--female); }
  .node.root { border-color: #444; }
  .node.ghost { width: 132px; border-style: dashed; border-color: var(--hi); background: transparent; color: var(--hi); font-weight: 500; }
  .node.new { border-color: var(--hi); box-shadow: 0 0 0 1px rgba(217, 180, 90, .25), 0 0 14px rgba(217, 180, 90, .12); }

  .fold {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 2;
    min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--wire); color: var(--dim);
    font: 10px/14px var(--mono); cursor: pointer; transition: opacity .3s;
  }
  .fold:hover { color: var(--text); border-color: var(--dim); }
</style>
</head>
<body>
  <aside role="tablist" aria-label="Chapter" id="tabs"></aside>
  <main id="chart"><div class="stage" id="stage"></div></main>

<script>
  // ch = chapter a name first appears in. Names keyed by chapter take the latest key ≤ the view's last chapter.
  // only = shown only in the view covering that chapter; under = sits right below its parent, outside the layout.
  // sex: m / f, or none for peoples (e.g. Jebusites). pair = a couple; children hang from the middle.
  const M = (name, ch, kids) => ({ name, ch, sex: "m", kids });
  const F = (name, ch, kids) => ({ name, ch, sex: "f", kids });
  const X = (name, ch) => ({ name, ch });
  const list = (ch, names, make = M) => names.map(n => make(n, ch));

  const TREE = {
    name: "God", ch: 1, cls: "root",
    kids: [{
      ch: 1,
      pair: [
        { sex: "m", name: { 1: "Male", 2: "The man", 3: "Adam" } },
        { sex: "f", name: { 1: "Female", 2: "The woman", 3: "Eve" } }
      ],
      kids: [
        M("Cain", 4, [M("Enoch", 4, [M("Irad", 4, [M("Mehujael", 4, [M("Methushael", 4, [M("Lamech", 4, [
          F("Adah", 4, [M("Jabal", 4), M("Jubal", 4)]),
          F("Zillah", 4, [M("Tubal-cain", 4), F("Naamah", 4)])
        ])])])])])]),
        M("Abel", 4),
        { name: "Seed of the woman", ch: 3, only: 3, under: true, cls: "ghost" },
        M("Seth", 4, [M("Enosh", 4, [M("Kenan", 5, [M("Mahalalel", 5, [M("Jared", 5, [M("Enoch", 5, [M("Methuselah", 5, [M("Lamech", 5, [
          M("Noah", 5, [
            M("Shem", 5, [
              M("Elam", 10), M("Asshur", 10),
              M("Arpachshad", 10, [M("Shelah", 10, [M("Eber", 10, [
                M("Peleg", 10),
                M("Joktan", 10, list(10, ["Almodad", "Sheleph", "Hazarmaveth", "Jerah", "Hadoram", "Uzal", "Diklah", "Obal", "Abimael", "Sheba", "Ophir", "Havilah", "Jobab"]))
              ])])]),
              M("Lud", 10),
              M("Aram", 10, list(10, ["Uz", "Hul", "Gether", "Mash"]))
            ]),
            M("Ham", 5, [
              M("Cush", 10, [M("Seba", 10), M("Havilah", 10), M("Sabtah", 10), M("Raamah", 10, list(10, ["Sheba", "Dedan"])), M("Sabteca", 10), M("Nimrod", 10)]),
              M("Mizraim", 10, list(10, ["Ludim", "Anamim", "Lehabim", "Naphtuhim", "Pathrusim", "Casluhim", "Caphtorim"], X)),
              M("Put", 10),
              M("Canaan", 9, [M("Sidon", 10), M("Heth", 10),
                ...list(10, ["Jebusites", "Amorites", "Girgashites", "Hivites", "Arkites", "Sinites", "Arvadites", "Zemarites", "Hamathites"], X)])
            ]),
            M("Japheth", 5, [
              M("Gomer", 10, list(10, ["Ashkenaz", "Riphath", "Togarmah"])),
              M("Magog", 10), M("Madai", 10),
              M("Javan", 10, [M("Elishah", 10), M("Tarshish", 10), X("Kittim", 10), X("Dodanim", 10)]),
              M("Tubal", 10), M("Meshech", 10), M("Tiras", 10)
            ])
          ])
        ])])])])])])])])
      ]
    }]
  };

  // Chapters that add nothing new to the tree share a view with their neighbors.
  const VIEWS = [
    { from: 1, to: 3, label: "1–3" },
    { from: 4, to: 4, label: "4" },
    { from: 5, to: 5, label: "5" },
    { from: 6, to: 9, label: "6–9" },
    { from: 10, to: 10, label: "10" }
  ];
  const W = 96, H = 30, BOND = 10, GAP = 10, ROW = 60, PAD = 20, INDENT = 14, SGAP = 6;
  const SYM = { m: "♂︎", f: "♀︎" };

  const at = (v, ch) => {
    if (v == null || typeof v !== "object") return v;
    let r; for (const k in v) if (+k <= ch) r = v[k];
    return r;
  };

  const nodes = [];
  (function walk(n, parent) {
    n.id = n.id || "n" + nodes.length;
    Object.assign(n, { parent, kids: n.kids || [] });
    nodes.push(n);
    n.kids.forEach(k => walk(k, n));
  })(TREE, null);

  let view = VIEWS[VIEWS.length - 1];
  const folded = new Set();
  const inView = n => n.ch <= view.to && (!n.only || (n.only >= view.from && n.only <= view.to));
  const foldedAbove = n => { for (let p = n.parent; p; p = p.parent) if (folded.has(p.id)) return p; return null; };
  const shown = n => inView(n) && !foldedAbove(n);

  // Layout uses the full tree (not the current chapter), so switching chapters never moves anything.
  // Childless siblings (2+) stack into one vertical list to keep the chart narrow.
  const layoutKids = n => folded.has(n.id) ? [] : n.kids.filter(k => !k.under);
  const unitW = n => n.pair ? 2 * W + BOND : n.cls === "ghost" ? 132 : W;
  const colW = c => c.node ? c.node.sw : INDENT + W;
  function measure(n) {
    const ks = layoutKids(n), leaves = ks.filter(k => !layoutKids(k).length);
    n.cols = [];
    let stack = null;
    ks.forEach(k => {
      if (leaves.length >= 2 && leaves.includes(k)) {
        if (!stack) n.cols.push(stack = { items: [] });
        stack.items.push(k);
      } else {
        n.cols.push({ node: k });
        measure(k);
      }
    });
    n.kw = n.cols.reduce((s, c) => s + colW(c), 0) + GAP * Math.max(0, n.cols.length - 1);
    n.sw = Math.max(unitW(n), n.kw);
  }
  function place(n, left, y) {
    Object.assign(n, { cx: left + n.sw / 2, y, stacked: false, spineX: null });
    let x = left + (n.sw - n.kw) / 2;
    n.cols.forEach(c => {
      if (c.node) place(c.node, x, y + ROW);
      else {
        n.spineX = x + INDENT / 2;
        c.items.forEach((k, i) => Object.assign(k, { cx: x + INDENT + W / 2, y: y + ROW + i * (H + SGAP), stacked: true }));
      }
      x += colW(c) + GAP;
    });
  }

  // Build every element once.
  const stage = document.getElementById("stage"), chart = document.getElementById("chart");
  const wire = () => { const d = document.createElement("div"); d.className = "wire off"; stage.appendChild(d); return d; };
  const boxHTML = p => `<div class="node ${p.sex || ""} ${p.cls || ""}">${p.sex ? `<i>${SYM[p.sex]}</i>` : ""}<span class="nm"></span></div>`;
  nodes.forEach(n => {
    if (n.kids.length) { n.stem = wire(); n.bar = wire(); n.spine = wire(); }
    if (n.parent) n.drop = wire();
  });
  nodes.forEach(n => {
    n.el = document.createElement("div");
    n.el.className = "unit off";
    n.el.innerHTML = (n.pair ? boxHTML(n.pair[0]) + `<span class="bond"></span>` + boxHTML(n.pair[1]) : boxHTML(n))
      + (n.kids.length ? `<button class="fold" type="button" data-fold="${n.id}"></button>` : "");
    n.boxes = [...n.el.querySelectorAll(".node")];
    n.btn = n.el.querySelector(".fold");
    stage.appendChild(n.el);
  });

  function setWire(el, x, y, w, h, on) {
    Object.assign(el.style, { left: x + "px", top: y + "px", width: Math.max(w, 0) + "px", height: Math.max(h, 0) + "px" });
    el.classList.toggle("off", !on);
  }
  const count = k => inView(k) ? 1 + k.kids.reduce((s, c) => s + count(c), 0) : 0;

  function update() {
    measure(TREE);
    place(TREE, PAD, PAD);
    // Folded-away nodes collapse into the folded ancestor.
    nodes.forEach(n => {
      const f = foldedAbove(n);
      if (n.under) Object.assign(n, { cx: n.parent.cx, y: n.parent.y + ROW, stacked: false });
      else if (f) Object.assign(n, { cx: f.cx, y: f.y, stacked: false });
    });

    let bottom = 0;
    nodes.forEach(n => {
      const on = shown(n);
      if (on) bottom = Math.max(bottom, n.y + H);
      n.el.style.width = unitW(n) + "px";
      n.el.style.transform = `translate(${n.cx - unitW(n) / 2}px, ${n.y}px)`;
      n.el.classList.toggle("off", !on);

      const isNew = n.ch >= view.from && n.ch <= view.to;
      (n.pair || [n]).forEach((p, i) => {
        n.boxes[i].querySelector(".nm").textContent = at(p.name, view.to);
        n.boxes[i].classList.toggle("new", isNew);
      });

      if (!n.kids.length) return;
      const vis = n.kids.filter(shown), st = vis.filter(k => k.stacked);
      const top = n.y + (n.pair ? H / 2 : H), mid = n.y + H + (ROW - H) / 2;
      const spineX = n.spineX ?? n.cx;
      setWire(n.stem, n.cx, top, 1, mid - top, vis.length > 0);
      const xs = vis.filter(k => !k.stacked).map(k => k.cx).concat(st.length ? [spineX] : []);
      const x0 = xs.length > 1 ? Math.min(...xs) : n.cx, x1 = xs.length > 1 ? Math.max(...xs) : n.cx;
      setWire(n.bar, x0, mid, x1 - x0 + 1, 1, xs.length > 1);
      const last = st.length ? st[st.length - 1].y + H / 2 : mid;
      setWire(n.spine, spineX, mid, 1, last - mid + 1, st.length > 0);
      n.kids.forEach(k => k.stacked
        ? setWire(k.drop, spineX, k.y + H / 2, k.cx - W / 2 - spineX, 1, shown(k))
        : setWire(k.drop, k.cx, mid, 1, k.y - mid, shown(k)));

      const isFolded = folded.has(n.id);
      n.btn.classList.toggle("off", !n.kids.some(inView));
      n.btn.textContent = isFolded ? "+" + n.kids.reduce((s, k) => s + count(k), 0) : "−";
      n.btn.setAttribute("aria-label", isFolded ? "Expand branch" : "Collapse branch");
    });

    stage.style.width = TREE.sw + 2 * PAD + "px";
    stage.style.height = Math.max(bottom, TREE.y + ROW * 2) + PAD + "px";
  }

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = VIEWS.map((v, i) => `<button type="button" role="tab" data-i="${i}">Gen<b>${v.label}</b></button>`).join("");

  function setView(i) {
    view = VIEWS[i];
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", +b.dataset.i === i));
    update();
    history.replaceState(null, "", "#gen" + view.to);
  }

  tabs.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) setView(+b.dataset.i);
  });
  stage.addEventListener("click", e => {
    const f = e.target.closest("[data-fold]");
    if (!f) return;
    const id = f.dataset.fold;
    folded.has(id) ? folded.delete(id) : folded.add(id);
    update();
  });

  const m = location.hash.match(/^#gen(\d+)$/);
  const start = m ? VIEWS.findIndex(v => +m[1] <= v.to) : -1;
  setView(start >= 0 ? start : VIEWS.length - 1);
  chart.scrollLeft = stage.offsetLeft + TREE.cx - chart.clientWidth / 2;
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("anim")));
</script>
</body>
</html>
